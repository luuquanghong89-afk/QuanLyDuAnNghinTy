<html>

<head>
    <style>
        body {
            width: 500px;
            margin: auto;
            background-color: cyan;
            font-family: sans-serif;
            padding: 40x;
        }
    </style>

</head>

<body>
    <div class="khung-can-giua" > 
        <h3 style="text-align: center;width: 100%;">Biểu mẫu khảo sát ITviec</h3>
        <form style="background-color: white;padding: 25px;border-radius: 5px;width: 100%;">
            
                <div style="margin-bottom:5px">
                    <label>Họ Tên</label>
                    <input type="text"
                           placeholder= "Nhập tên của bạn" 
                           style="box-sizing: border-box;width: 300px;padding: 10px;border-radius: 5px;border: 1px solid #ccc;" />
                </div>
                <div style="margin-bottom:15px">
                    <label>Email</label>
                    <input type="text" 
                           placeholder="Nhập email của bạn" 
                           style="width: 300px;padding: 10px;border-radius: 5px;border: 1px solid #ccc;" />
                </div>
                <div style="margin-bottom:15px">
                    <label>Tuổi</label>
                    <input type="text" 
                           placeholder="Nhập tuổi của bạn" 
                           style="box-sizing: border-box;width: 300px;padding: 10px;border-radius: 5px;border: 1px solid #ccc;" />
                </div>
                <div style="margin-bottom:15px">
                    <label>Hiện tại bạn đang là?</label>
                    <select style="box-sizing: border-box;width: 300px;padding: 10px;border-radius: 5px;border: 1px solid #ccc;">
                        <option>Học sinh/Sinh viên</option>
                        <option>Giáo sư/Tiến sĩ</option>
                        <option>Chủ tịch/Giám đốc</option>
                    </select>
                </div>
                <div style="margin-bottom:15px">
                    <label>Bạn sẽ giới thiệu ITviec với bạn bè chứ?</label>
                    <input type="radio" name="recommend" /> Có
                    <input type="radio" name="recommend" /> Không
                    <input type="radio" name="recommend" /> Có thể
                </div>
                <div style="margin-bottom:15px">
                    <label>Ngôn ngữ lập trình và Framework mà bạn đã biết?(có thể chọn nhiều đáp án)</label>
                    <input type="checkbox" name="sothich" value="c" /> C
                    <input type="checkbox" name="sothich" value="c#" />  C#
                    <input type="checkbox" name="sothich" value="c++" /> C++
                </div>
                <div style="margin-bottom:15px">
                  <label>Bạn có câu hỏi gì cho ITviec không?</label>
                <textarea class="input-field" rows="4" placeholder="Nhập câu hỏi của bạn..."></textarea>
                </div>

            <button type="submit">SUBMIT</button>
            </form>
    </div>
</body>

</html>
